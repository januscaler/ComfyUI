# Model Download URLs
# Maps folder_name/filename -> HuggingFace OR direct URL
#
# HuggingFace format: "repo_id@filepath_in_repo"
#   Example: checkpoints/sd_xl_base_1.0.safetensors: stabilityai/stable-diffusion-xl-base-1.0@sd_xl_base_1.0.safetensors
#   For subdirectories: some-repo/name@subdir/file.safetensors
#
# Direct URL format: starts with http:// or https://
#   Example: loras/my_lora.safetensors: https://example.com/models/my_lora.safetensors
#
# Filename-only keys also work (checked as fallback):
#   sd_xl_base_1.0.safetensors: stabilityai/stable-diffusion-xl-base-1.0@sd_xl_base_1.0.safetensors

