
services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      target: comfyui
    image: comfyui-sync-api:latest
    command: sh -c "python main.py --listen 0.0.0.0 --port 8188 --auto-download-models $${COMFYUI_ARGS:-}"
    ports:
      - "8188:8188"
    volumes:
      - ./models:/opt/ComfyUI/models
      - ./input:/opt/ComfyUI/input
      - ./output:/opt/ComfyUI/output
      - ./temp:/opt/ComfyUI/temp
      - ./user:/opt/ComfyUI/user
      - ./api_server/workflows:/opt/ComfyUI/api_server/workflows
      - ~/VoxMin/ace-step/huggingface:/root/.cache/huggingface
      # Reuse another project's Hugging Face download cache instead of
      # re-downloading blobs (helps downloads that go through hf_hub_download,
      # i.e. repo@file style URLs; direct https://...resolve/main URLs bypass
      # this cache and land straight in ./models above):
      - ~/VoxMin/ace-step/huggingface:/root/.cache/huggingface
    environment:
      - DO_NOT_TRACK=1
      - HF_HUB_DISABLE_TELEMETRY=1
      # HF_TOKEN is passed through from the host env or a .env file (required
      # for gated models, e.g. the FLUX.2 klein 9B fp8 checkpoint).
      - HF_TOKEN=${HF_TOKEN:-}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  developer-api:
    image: comfyui-sync-api:latest
    depends_on:
      comfyui:
        condition: service_healthy
    command: uvicorn api_server.developer_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./api_server/workflows:/opt/ComfyUI/api_server/workflows
    environment:
      - COMFYUI_BASE_URL=http://comfyui:8188
      - COMFYUI_WORKFLOW_DIR=/opt/ComfyUI/api_server/workflows
      - COMFYUI_API_TIMEOUT_SECONDS=900
      - COMFYUI_API_POLL_INTERVAL_SECONDS=1.0
    restart: unless-stopped
